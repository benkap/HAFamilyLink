name: Trivy

on:
  push:
    branches: ["main"]
    paths:
      - "familylink-playwright/**"
      - ".github/workflows/trivy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "familylink-playwright/**"
      - ".github/workflows/trivy.yml"
  schedule:
    - cron: "26 5 * * 6" # Saturday 05:26 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Docker ${{ matrix.image.label }} vulnerability report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        image:
          - label: add-on image
            dockerfile: familylink-playwright/Dockerfile
            tag: hafamilylink-auth-addon
          - label: standalone image
            dockerfile: familylink-playwright/Dockerfile.standalone
            tag: hafamilylink-auth-standalone

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: familylink-playwright
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ matrix.image.tag }}:${{ github.sha }}
          cache-from: type=gha,scope=trivy-${{ matrix.image.tag }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.image.tag }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image.tag }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
